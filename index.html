<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="apple-touch-icon" href="icons/launcher-icon.png">
    <link rel="apple-touch-startup-image" href="icons/startup.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111">

  <title>Google Launcher</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: Arial, sans-serif;
    }

    .launcher {
      width: 320px;
      padding: 24px;
      background: #222;
      border-radius: 28px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    h1 {
      margin: 0 0 20px;
      color: white;
      font-size: 24px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    button {
      padding: 18px 12px;
      border: 0;
      border-radius: 18px;
      background: #333;
      color: white;
      font-size: 16px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    button:hover {
      background: #3a3a3a;
    }

    button img {
  width: 48px;
  height: 48px;
  object-fit: contain;
  display: block;
  margin: 0 auto 10px;
}

button:active {
  transform: scale(0.96);
  background: #3a3a3a;
}

.grid button:last-child {
  grid-column: 1 / -1;
  width: calc(50% - 7px);
  justify-self: center;
}

.subtitle {
  margin: -10px 0 18px;
  text-align: center;
  color: #8f8f8f;
  font-size: 14px;
}
  </style>
</head>

<body>
  <div class="launcher">
    <h1>Google Apps</h1>
    <p class="subtitle">Quick access</p>

    <div class="grid">
      <button onclick="openDrive()">
  <img src="icons/google-drive.png" alt="Drive">
  <span>Drive</span>
</button>
      <button onclick="openDocs()">
  <img src="icons/google-docs.png" alt="Docs">
  <span>Docs</span>
</button>
      <button onclick="openSheets()">
  <img src="icons/sheets.png" alt="Sheets">
  <span>Sheets</span>
</button>
      <button onclick="openSlides()">
  <img src="icons/slides.png" alt="Slides">
  <span>Slides</span>
</button>
      <button onclick="openYouTube()">
  <img src="icons/youtube.png" alt="YouTube">
  <span>YouTube</span>
</button>
    </div>
  </div>

  <script>
  function openDrive() {
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (isIOS) {
      window.location.href = 'googledrive://';
    } else {
      window.location.href = 'https://drive.google.com';
    }
  }
</script>

<script>
  function openDocs() {
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (isIOS) {
      window.location.href = 'googledocs://';
    } else {
      window.location.href = 'https://docs.google.com';
    }
  }
</script>

<script>
  function openSheets() {
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (isIOS) {
      window.location.href = 'googlesheets://';
    } else {
      window.location.href = 'https://sheets.google.com';
    }
  }
  
</script>

<script>
  function openSlides() {
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (isIOS) {
      window.location.href = 'googleslides://';
    } else {
      window.location.href = 'https://slides.google.com';
    }
  }
</script>

<script>
  function openYouTube() {
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (isIOS) {
      window.location.href = 'youtube://';
    } else {
      window.location.href = 'https://youtube.com';
    }
  }
</script>

</body>
</html>
