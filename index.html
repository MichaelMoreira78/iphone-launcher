<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="apple-touch-icon" href="icons/launcher-icon.png">
    <link rel="apple-touch-startup-image" href="icons/startup.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111">

  <title>Google Launcher</title>

  <style>
    html {
      background: #f5f5f7;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f7;
      font-family: Arial, sans-serif;
    }

    .launcher {
  width: min(380px, calc(100vw - 32px));
  box-sizing: border-box;
  padding: 28px 18px 24px;
  background: #ffffff;
  border-radius: 34px;
  box-shadow: 0 18px 35px rgba(0, 0, 0, 0.12);
}

    h1 {
      margin: 0 0 20px;
      color: #1d1d1f;
      font-size: 24px;
      text-align: center;
    }
    .pager {
      width: 100%;
      overflow: hidden;
    }

    .pages {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .pages::-webkit-scrollbar {
      display: none;
    }

    .page {
      flex: 0 0 100%;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: repeat(3, 64px);
      column-gap: 22px;
      row-gap: 16px;
      justify-content: center;
      align-content: start;
      scroll-snap-align: start;
      padding: 0 2px;
    }

    .page-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 18px;
    }

    .page-dot {
      width: 7px;
      height: 7px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: #d1d1d6;
      box-shadow: none;
      cursor: pointer;
    }

    .page-dot.active {
      background: #8e8e93;
    }

    .app-item {
      width: 100%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-tile {
  width: 64px;
  height: 64px;
  border: 1px solid #e5e5ea;
  border-radius: 18px;
  background: #f2f2f7;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
  transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
}

    .app-tile:hover {
      background: #ededf2;
    }

    .app-tile:active {
      transform: scale(0.96);
      background: #e8e8ed;
    }

    .app-tile img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      display: block;
      margin: 0;
    }

    .app-label {
      margin-top: 8px;
      max-width: 100%;
      color: #1d1d1f;
      font-size: 13px;
      line-height: 1.15;
      text-align: center;
      overflow-wrap: anywhere;
    }



.subtitle {
  margin: -10px 0 20px;
  text-align: center;
  color: #86868b;
  font-size: 14px;
}

.google-mark {
  width: 58px;
  height: 58px;
  margin: 0 auto 14px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #ffffff;
  border: 1px solid #e5e5ea;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
}

.google-mark img {
  width: 36px;
  height: 36px;
  object-fit: contain;
  display: block;
}
  </style>
</head>

<body>
  <div class="launcher" id="launcher">
    <div class="google-mark">
  <img src="icons/google-g.png" alt="Google">
</div>
    <h1>Google Apps</h1>
    <p class="subtitle">Quick access</p>

    <div class="pager">
      <div class="pages"></div>
      <div class="page-dots" aria-label="Launcher pages"></div>
    </div>
  </div>


  <script>
  const apps = [
    {
      name: "Drive",
      icon: "icons/google-drive.png",
      ios: "googledrive://",
      web: "https://drive.google.com"
    },
    {
      name: "Docs",
      icon: "icons/google-docs.png",
      ios: "googledocs://",
      web: "https://docs.google.com"
    },
    {
      name: "Sheets",
      icon: "icons/sheets.png",
      ios: "googlesheets://",
      web: "https://sheets.google.com"
    },
    {
      name: "Slides",
      icon: "icons/slides.png",
      ios: "googleslides://",
      web: "https://slides.google.com"
    },
    {
      name: "YouTube",
      icon: "icons/youtube.png",
      ios: "youtube://",
      web: "https://youtube.com"
    },
    {
  name: "Calendar",
  icon: "icons/calendar.png",
  ios: "googlecalendar://",
  web: "https://calendar.google.com"
},
{
  name: "Chrome",
  icon: "icons/chrome.png",
  ios: "googlechrome://",
  web: "https://www.google.com/chrome/"
},
{
  name: "Gemini",
  icon: "icons/gemini.png",
  ios: "googleapp://",
  web: "https://gemini.google.com"
},
{
  name: "Gmail",
  icon: "icons/gmail.png",
  ios: "googlegmail://",
  web: "https://mail.google.com"
},
{
  name: "Google Cloud",
  icon: "icons/google-cloud.png",
  ios: "googlecloud://",
  web: "https://console.cloud.google.com"
},
{
  name: "Google Maps",
  icon: "icons/google-maps.png",
  ios: "comgooglemaps://",
  web: "https://maps.google.com"
},
{
  name: "Google Translate",
  icon: "icons/google-translate.png",
  ios: "googletranslate://",
  web: "https://translate.google.com"
},
{
  name: "Meet",
  icon: "icons/meet.png",
  ios: "gmeet://",
  web: "https://meet.google.com"
},
  ];

  const pagesContainer = document.querySelector(".pages");
const dotsContainer = document.querySelector(".page-dots");
const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
const APPS_PER_PAGE = 9;

// Keep the launcher alphabetized automatically.
apps.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: "base" }));

function createAppItem(app) {
  const appItem = document.createElement("div");
  appItem.className = "app-item";

  const button = document.createElement("button");
  button.className = "app-tile";
  button.type = "button";
  button.setAttribute("aria-label", `Open ${app.name}`);

  const icon = document.createElement("img");
  icon.src = app.icon;
  icon.alt = "";

  const label = document.createElement("div");
  label.className = "app-label";
  label.textContent = app.name;

  button.appendChild(icon);

  button.addEventListener("click", () => {
    window.location.href = isIOS ? app.ios : app.web;
  });

  appItem.appendChild(button);
  appItem.appendChild(label);
  return appItem;
}

const pageCount = Math.ceil(apps.length / APPS_PER_PAGE);

for (let pageIndex = 0; pageIndex < pageCount; pageIndex++) {
  const page = document.createElement("div");
  page.className = "page";

  const pageApps = apps.slice(
    pageIndex * APPS_PER_PAGE,
    (pageIndex + 1) * APPS_PER_PAGE
  );

  pageApps.forEach(app => {
    page.appendChild(createAppItem(app));
  });

  pagesContainer.appendChild(page);

  const dot = document.createElement("button");
  dot.type = "button";
  dot.className = "page-dot" + (pageIndex === 0 ? " active" : "");
  dot.setAttribute("aria-label", `Go to page ${pageIndex + 1}`);

  dot.addEventListener("click", () => {
    pagesContainer.scrollTo({
      left: pageIndex * pagesContainer.clientWidth,
      behavior: "smooth"
    });
  });

  dotsContainer.appendChild(dot);
}

function updatePageDots() {
  const width = pagesContainer.clientWidth;
  if (!width) return;

  const currentPage = Math.round(pagesContainer.scrollLeft / width);

  dotsContainer.querySelectorAll(".page-dot").forEach((dot, index) => {
    dot.classList.toggle("active", index === currentPage);
  });
}

pagesContainer.addEventListener("scroll", updatePageDots, { passive: true });
window.addEventListener("resize", updatePageDots);

</script>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js");
  }
</script>

</body>
</html>
